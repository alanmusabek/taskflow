{% extends "projects/base.html" %}

{% block title %}Delete Task | TaskFlow{% endblock %}

{% block content %}
<div class="card">
    <h1>Delete Task</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ task.title }}</strong>?
    </p>

    <p class="muted">This action cannot be undone.</p>

    <form method="post">
        {% csrf_token %}

        <button type="submit" class="button button-danger">Yes, Delete</button>

        <a href="{% url 'tasks:detail' task.pk %}" class="button button-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
